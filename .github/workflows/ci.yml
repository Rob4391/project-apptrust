name: AppTrust CI

on:
  push:
    branches: [main, first-branch]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apptrust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          set +e
          npm audit --audit-level=high --json > audit-report.json
          audit_exit_code=$?
          set -e
          printf '%s' "$audit_exit_code" > audit-exit-code.txt

      - name: Enforce approved audit baseline
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const reportPath = path.join(process.cwd(), "audit-report.json");
          const exitCodePath = path.join(process.cwd(), "audit-exit-code.txt");

          if (!fs.existsSync(reportPath) || !fs.existsSync(exitCodePath)) {
            console.error("npm audit did not produce the expected report artifacts.");
            process.exit(1);
          }

          let report;

          try {
            report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          } catch (error) {
            console.error("npm audit did not produce valid JSON output.");
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          }

          const auditExitCode = Number.parseInt(fs.readFileSync(exitCodePath, "utf8").trim(), 10);

          if (!Number.isInteger(auditExitCode)) {
            console.error("npm audit exit code could not be read.");
            process.exit(1);
          }

          if (report.auditReportVersion !== 2 || typeof report.vulnerabilities !== "object" || report.vulnerabilities === null) {
            console.error("npm audit report format was not recognized.");
            process.exit(1);
          }

          const approvedHighSeverityAdvisories = new Map([
            [1124252, { severity: "high", title: "PostCSS: Arbitrary file read and information disclosure via attacker-controlled sourceMappingURL in CSS comments" }],
            [1139510, { severity: "high", title: "PostCSS: Path Traversal in Previous Source Map Auto-Loading (sourceMappingURL) leads to Arbitrary .map File Disclosure" }],
            [1123525, { severity: "high", title: "vite: `server.fs.deny` bypass on Windows alternate paths" }],
          ]);

          const highSeverityFindings = new Map();

          for (const vulnerability of Object.values(report.vulnerabilities ?? {})) {
            for (const finding of vulnerability.via ?? []) {
              if (typeof finding === "string" || !["high", "critical"].includes(finding.severity)) {
                continue;
              }

              highSeverityFindings.set(finding.source, {
                severity: finding.severity,
                title: finding.title,
              });
            }
          }

          if (auditExitCode === 0 && highSeverityFindings.size > 0) {
            console.error("npm audit reported success despite returning high-severity findings.");
            process.exit(1);
          }

          if (auditExitCode !== 0 && auditExitCode !== 1) {
            console.error(`npm audit exited unexpectedly with code ${auditExitCode}.`);
            process.exit(1);
          }

          const unexpectedFindings = [...highSeverityFindings.entries()].filter(
            ([source]) => !approvedHighSeverityAdvisories.has(source),
          );
          const changedApprovedFindings = [...approvedHighSeverityAdvisories.entries()].filter(
            ([source, approved]) => {
              const finding = highSeverityFindings.get(source);
              return !finding || finding.severity !== approved.severity || finding.title !== approved.title;
            },
          );

          if (unexpectedFindings.length > 0) {
            console.error("Unexpected high-severity npm audit findings detected:");
            for (const [source, finding] of unexpectedFindings) {
              console.error(`- ${source} [${finding.severity}]: ${finding.title}`);
            }
            process.exit(1);
          }

          if (changedApprovedFindings.length > 0) {
            console.error("Approved npm audit baseline no longer matches the current report:");
            for (const [source, approved] of changedApprovedFindings) {
              const finding = highSeverityFindings.get(source);
              if (!finding) {
                console.error(`- ${source} [${approved.severity}]: missing from the current audit report`);
                continue;
              }

              console.error(`- ${source}: expected [${approved.severity}] ${approved.title}`);
              console.error(`  actual   [${finding.severity}] ${finding.title}`);
            }
            process.exit(1);
          }

          if (highSeverityFindings.size === 0) {
            console.log("npm audit reported no high-severity findings.");
            process.exit(0);
          }

          console.log("Approved npm audit baseline only:");
          for (const [source, finding] of highSeverityFindings) {
            console.log(`- ${source} [${finding.severity}]: ${finding.title}`);
          }
          EOF

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high