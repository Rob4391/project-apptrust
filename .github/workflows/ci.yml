name: AppTrust CI

on:
  push:
    branches: [main, first-branch]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apptrust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=high --json > audit-report.json || true

      - name: Enforce approved audit baseline
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const report = JSON.parse(fs.readFileSync("audit-report.json", "utf8"));
          const approvedHighSeverityAdvisories = new Map([
            [1124252, "PostCSS: Arbitrary file read and information disclosure via attacker-controlled sourceMappingURL in CSS comments"],
            [1139510, "PostCSS: Path Traversal in Previous Source Map Auto-Loading (sourceMappingURL) leads to Arbitrary .map File Disclosure"],
            [1123525, "vite: server.fs.deny bypass on Windows alternate paths"],
            [1139528, "Vitest UI server can read and execute arbitrary files"],
          ]);

          const highSeverityFindings = new Map();

          for (const vulnerability of Object.values(report.vulnerabilities ?? {})) {
            for (const finding of vulnerability.via ?? []) {
              if (typeof finding === "string" || !["high", "critical"].includes(finding.severity)) {
                continue;
              }

              highSeverityFindings.set(finding.source, finding.title);
            }
          }

          const unexpectedFindings = [...highSeverityFindings.entries()].filter(
            ([source]) => !approvedHighSeverityAdvisories.has(source),
          );

          if (unexpectedFindings.length > 0) {
            console.error("Unexpected high-severity npm audit findings detected:");
            for (const [source, title] of unexpectedFindings) {
              console.error(`- ${source}: ${title}`);
            }
            process.exit(1);
          }

          console.log("Approved npm audit baseline only:");
          for (const [source, title] of approvedHighSeverityAdvisories) {
            if (highSeverityFindings.has(source)) {
              console.log(`- ${source}: ${title}`);
            }
          }
          EOF

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high